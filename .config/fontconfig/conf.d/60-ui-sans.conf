<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- Clean sans for all UI. Lives in conf.d so `omarchy font set`
       (which rewrites ../fonts.conf for the monospace alias) leaves it alone. -->

  <!-- Generic sans aliases: GTK/Qt/Firefox/Chromium UI and web default sans. -->
  <match target="pattern">
    <test name="family" qual="any"><string>sans-serif</string></test>
    <edit name="family" mode="prepend_first" binding="strong"><string>Inter</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>system-ui</string></test>
    <edit name="family" mode="prepend_first" binding="strong"><string>Inter</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>ui-sans-serif</string></test>
    <edit name="family" mode="prepend_first" binding="strong"><string>Inter</string></edit>
  </match>

  <match target="pattern">
    <test name="family" qual="any"><string>-apple-system</string></test>
    <edit name="family" mode="prepend_first" binding="strong"><string>Inter</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>BlinkMacSystemFont</string></test>
    <edit name="family" mode="prepend_first" binding="strong"><string>Inter</string></edit>
  </match>

  <!-- The Omarchy shell (bar, menus, notifications, lock, OSD) and Hyprland's
       group bars hard-code the "monospace" alias. Resolve that alias to Inter
       for just those two programs; terminals and editors keep the real mono. -->
  <match target="pattern">
    <test name="prgname"><string>quickshell</string></test>
    <test name="family" qual="any"><string>monospace</string></test>
    <edit name="family" mode="assign_replace" binding="strong"><string>Inter</string></edit>
  </match>
  <match target="pattern">
    <test name="prgname"><string>Hyprland</string></test>
    <test name="family" qual="any"><string>monospace</string></test>
    <edit name="family" mode="assign_replace" binding="strong"><string>Inter</string></edit>
  </match>
</fontconfig>
